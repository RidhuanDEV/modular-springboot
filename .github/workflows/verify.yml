name: Native Spring Boot
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Full build without tests
        shell: pwsh
        run: |
          if ($IsWindows) { ./mvnw.cmd -B "-Dmaven.test.skip=true" package } else { ./mvnw -B "-Dmaven.test.skip=true" package }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Final collecting stage
        shell: pwsh
        run: |
          if ($IsWindows) { ./scripts/verify-stage.ps1 -SkipDocker } else { ./scripts/verify-stage.ps1 }
      - name: Dependency and license audit
        if: always()
        shell: pwsh
        run: ./scripts/verify-dependencies.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostics-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/springboot-verification-*
            ${{ runner.temp }}/spring-dependency-audit-*
            target/surefire-reports
